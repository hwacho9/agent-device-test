name: Mobile E2E Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: mobile-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-e2e:
    name: android-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@v6.5.0
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Install project-local agent-device
        run: npm ci

      - name: Install video tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, validate, install, replay and record
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: AgentDeviceE2EDemo_CI_API35
          emulator-port: 5554
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 900
          script: DEMO_AVD=AgentDeviceE2EDemo_CI_API35 DEMO_ANDROID_SERIAL=emulator-5554 bash scripts/run-platform-ci.sh android

      - name: Collect Android evidence
        if: always()
        run: bash scripts/collect-ci-evidence.sh android

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-e2e-evidence
          path: artifacts/ci-evidence/android/
          if-no-files-found: error
          retention-days: 5

  ios-e2e:
    name: ios-e2e
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@v6.5.0
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Install project-local agent-device
        run: npm ci

      - name: Install video tooling
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Select available iPhone Simulator
        run: bash scripts/select-ios-simulator.sh

      - name: Build, validate, install, prepare, replay and record
        run: bash scripts/run-platform-ci.sh ios

      - name: Collect iOS evidence
        if: always()
        run: bash scripts/collect-ci-evidence.sh ios

      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-e2e-evidence
          path: artifacts/ci-evidence/ios/
          if-no-files-found: error
          retention-days: 5

  pr-evidence:
    name: pr-evidence
    needs: [android-e2e, ios-e2e]
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout reporting scripts
        uses: actions/checkout@v6.0.2

      - name: Download Android evidence
        continue-on-error: true
        uses: actions/download-artifact@v7.0.0
        with:
          name: android-e2e-evidence
          path: artifacts/downloaded/android

      - name: Download iOS evidence
        continue-on-error: true
        uses: actions/download-artifact@v7.0.0
        with:
          name: ios-e2e-evidence
          path: artifacts/downloaded/ios

      - name: Generate and publish stable-marker summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-pr-evidence.sh "${{ github.event.pull_request.number }}"
          cat artifacts/pr/pr-summary.md >> "$GITHUB_STEP_SUMMARY"
